<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnlyFeeters</title>
    <link rel="icon" type="image/webp" href="icon.webp">
    <style>
        /* Modern reset and centering */
        body {
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f172a; /* Sleek, premium dark background */
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Container card to keep everything neatly organized and centered */
        .card {
            background-color: #1e293b; /* Slightly lighter dark for contrast */
            max-width: 450px;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            text-align: center;
            border: 1px solid #334155;
        }

        /* Responsive banner layout */
        .banner-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            background-color: #334155; /* Fallback color if image loads slow */
        }

        /* Content spacing padding inside the card */
        .content {
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #ff6b6b, #ff8e53); /* Eye-catching gradient */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Clean, high-conversion premium landing button */
        .custom-button {
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #007bff, #0056b3);
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
            transition: all 0.2s ease;
        }

        /* Dynamic hover animation */
        .custom-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.4);
            background: linear-gradient(135deg, #0086ff, #0062cc);
        }

        /* Tap/Click feedback animation */
        .custom-button:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(0, 123, 255, 0.4);
        }

        small {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Banner image stays pinned flawlessly at the top -->
        <img class="banner-img" src="banner.webp" alt="OnlyFeeters Banner">
        
        <div class="content">
            <h1>OnlyFeeters</h1>
            
            <a href="https://discord.gg/az86tdkPyy" target="_blank" class="custom-button">
                press if you love feet
            </a>
            
            <small>page made with 👣 by tryrot136</small>
        </div>
    </div>

</body>
</html>
